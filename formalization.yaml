    "name": "Monotone-Light Factorization of Compact Hausdorff Surjections",
    "description": "Every continuous surjection between compact Hausdorff spaces factors through a compact Hausdorff quotient that collapses exactly the connected components of each original fiber. The first map has connected fibers and the second has totally disconnected fibers. Any two such factorizations have a unique commuting homeomorphism. Empty spaces are permitted.",
