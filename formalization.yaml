  "fidelity": {
    "divergences": "Specializes the source theorem to continuous surjections between compact Hausdorff spaces. The relation is proved closed by separating two distinct components in a compact fiber with clopen pieces, extending to disjoint ambient open sets, and using closedness of the original map to control nearby fibers. Compact projection makes the quotient map closed, and normal separation gives a Hausdorff quotient. The light proof applies the existing closed-connected-preimage theorem to the closure of a preconnected subset. Uniqueness compares kernels and constructs a commuting homeomorphism. No metric, local connectedness or nonemptiness assumption is used."
  },
